services:
  - type: web
    name: sharan-backend
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: EMAIL_MODE
        value: mock
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: OTP_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: JOBS_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
